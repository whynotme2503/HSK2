<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra cuối khóa HSK2</title>
<style>
  :root{
    --bg:#eaf4ea;
    --bg2:#dfeedf;
    --card:#ffffff;
    --ink:#24402a;
    --ink-soft:#4e6b55;
    --mint:#b7ddc0;
    --mint-soft:#d6ebd9;
    --mint-line:#c3e0c9;
    --green:#5f9e6d;
    --green-dark:#3f7a4c;
    --ok:#4e9a62;
    --ok-bg:#e4f3e6;
    --no:#c97b74;
    --no-bg:#fbeae8;
    --shadow:0 2px 10px rgba(63,122,76,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 400px at 10% -10%, #f3faf3 0%, rgba(243,250,243,0) 70%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 140px}

  /* ---------- header ---------- */
  header{
    background:linear-gradient(135deg,#cfe8d4 0%,#b7ddc0 100%);
    border:1px solid var(--mint-line);
    border-radius:22px;
    padding:30px 28px;
    text-align:center;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  header:after{
    content:"汉语";
    position:absolute;right:16px;bottom:-14px;
    font-size:72px;font-weight:800;color:rgba(255,255,255,.35);
    letter-spacing:4px;line-height:1;
  }
  h1{margin:0 0 6px;font-size:28px;letter-spacing:.2px;color:#2d5437}
  .sub{margin:0;color:#44704f;font-size:14.5px}
  .who{margin:12px 0 0;font-size:13.5px;font-weight:700;color:#35603f;display:none}
  .who.on{display:block}

  /* ---------- gate ---------- */
  .gate{
    background:var(--card);border:1px solid var(--mint-line);border-radius:20px;
    padding:28px 24px;margin-top:20px;box-shadow:var(--shadow);text-align:center;
  }
  .gate h2{margin:0 0 6px;font-size:19px;color:#2d5437}
  .gate p{margin:0 0 18px;font-size:14px;color:var(--ink-soft)}
  .gate .row{display:flex;gap:10px;max-width:460px;margin:0 auto;flex-wrap:wrap}
  .gate input{
    flex:1 1 200px;font:inherit;font-size:16px;padding:12px 14px;
    border:1.5px solid var(--mint-line);border-radius:14px;background:#f8fcf8;color:var(--ink);
  }
  .gate input:focus{outline:0;border-color:var(--green);background:#fff}
  .gate .err{color:#b05a52;font-size:13px;font-weight:600;margin-top:10px;min-height:18px}

  /* ---------- sections ---------- */
  section{
    background:var(--card);
    border:1px solid var(--mint-line);
    border-radius:20px;
    padding:22px 22px 10px;
    margin-top:20px;
    box-shadow:var(--shadow);
  }
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .sec-num{
    flex:0 0 auto;width:34px;height:34px;border-radius:12px;
    background:var(--mint-soft);color:var(--green-dark);
    display:grid;place-items:center;font-weight:800;font-size:15px;
  }
  .sec-title{font-size:18px;font-weight:700;margin:0;color:#2d5437}
  .sec-note{margin:2px 0 16px 46px;font-size:13.5px;color:var(--ink-soft)}

  .bank{
    background:var(--mint-soft);
    border:1px dashed var(--mint-line);
    border-radius:14px;padding:12px 14px;margin:0 0 18px;
  }
  .bank-title{font-size:12.5px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
  .bank ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
  .bank li{font-size:16px}
  .bank .lt{font-weight:800;color:var(--green-dark);margin-right:6px}
  .bank.inline ul{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}

  /* ---------- passage ---------- */
  .passage{
    background:#f6fbf6;border:1px solid var(--mint-line);border-left:4px solid var(--mint);
    border-radius:14px;padding:16px 18px;margin:0 0 18px;
  }
  .passage .tag{
    display:inline-block;font-size:12px;font-weight:700;color:var(--green-dark);
    background:var(--mint-soft);border-radius:999px;padding:2px 10px;margin-bottom:8px;
  }
  .passage p{margin:0 0 10px;font-size:18px;line-height:2;letter-spacing:.3px}
  .passage p:last-child{margin-bottom:0}

  /* ---------- questions ---------- */
  .q{padding:14px 0;border-top:1px solid #eef5ee}
  .q:first-of-type{border-top:0}
  .q-text{display:flex;gap:10px;align-items:baseline;font-size:17.5px;line-height:1.9}
  .q-no{
    flex:0 0 auto;min-width:26px;height:26px;padding:0 6px;border-radius:9px;
    background:#f0f7f1;color:var(--green-dark);font-size:13px;font-weight:800;
    display:inline-grid;place-items:center;transform:translateY(-2px)
  }
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 36px}
  .opt{
    appearance:none;cursor:pointer;font:inherit;font-size:16px;
    background:#fff;border:1.5px solid var(--mint-line);color:var(--ink);
    border-radius:12px;padding:7px 14px;transition:.15s;
  }
  .opt:hover{border-color:var(--green);background:#f4fbf5}
  .opt .k{font-weight:800;color:var(--green-dark);margin-right:6px}
  .opt.sel{background:var(--mint-soft);border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
  .opt.tf{min-width:56px;font-size:18px;font-weight:700}
  .graded .opt{cursor:default}
  .opt.good{background:var(--ok-bg);border-color:var(--ok);color:#2f6b3f}
  .opt.bad{background:var(--no-bg);border-color:var(--no);color:#8d433c;text-decoration:line-through}
  .fb{margin:10px 0 0 36px;font-size:14px;font-weight:600;display:none}
  .graded .fb{display:block}
  .fb.y{color:var(--ok)}
  .fb.n{color:#b05a52}

  /* ---------- bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--mint-line);
    padding:12px 18px;display:none;
  }
  .bar.on{display:block}
  .bar-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .prog{flex:1;min-width:120px}
  .prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
  .track{height:8px;background:#e7f1e8;border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#8fc79b,#5f9e6d);border-radius:999px;transition:width .3s}
  .clock{
    flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;
    color:var(--green-dark);background:var(--mint-soft);border-radius:12px;padding:8px 12px;
  }
  button.act{
    appearance:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;
    border:0;border-radius:14px;padding:11px 20px;color:#fff;
    background:linear-gradient(135deg,#6aad78,#4e8e5c);box-shadow:0 3px 10px rgba(78,142,92,.3)
  }
  button.act:hover{filter:brightness(1.05)}
  button.ghost{background:#fff;color:var(--green-dark);border:1.5px solid var(--mint-line);box-shadow:none}

  /* ---------- result ---------- */
  .result{display:none;margin-top:20px}
  .result.on{display:block}
  .score-card{
    background:linear-gradient(135deg,#cfe8d4,#b7ddc0);
    border:1px solid var(--mint-line);border-radius:20px;
    padding:24px;text-align:center;box-shadow:var(--shadow)
  }
  .score-num{font-size:46px;font-weight:800;color:#2d5437;line-height:1.1}
  .score-num small{font-size:20px;font-weight:700;color:#4e7a58}
  .score-msg{margin-top:6px;color:#3f6b48;font-weight:600}
  .score-grid{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .score-grid div{background:rgba(255,255,255,.7);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;color:#3f6b48}
  .sync{margin-top:12px;font-size:12.5px;font-weight:700;color:#41704d;min-height:18px}
  footer{text-align:center;color:#6b8a73;font-size:12.5px;margin-top:26px}
  @media(max-width:560px){
    .wrap{padding:18px 12px 150px}
    h1{font-size:23px}
    .passage p,.q-text{font-size:16.5px}
    .opts,.fb{margin-left:0}
    .bar-in{gap:8px;flex-wrap:wrap}
    .prog{order:1;flex:1 1 100%}
    .clock{order:2}
    button.act{order:3;flex:1;padding:10px 12px;font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Kiểm tra cuối khóa HSK2</h1>
    <p class="sub">阅读 · Đọc hiểu · 30 câu</p>
    <p class="who" id="who"></p>
  </header>

  <!-- màn hình nhập tên -->
  <div class="gate" id="gate">
    <h2>Nhập tên của bạn để bắt đầu</h2>
    <p>Thời gian làm bài sẽ được tính từ lúc bạn bấm "Bắt đầu làm bài".</p>
    <div class="row">
      <input id="nameInput" type="text" placeholder="Họ và tên" autocomplete="name" maxlength="60">
      <button class="act" id="btnStart">Bắt đầu làm bài</button>
    </div>
    <div class="err" id="nameErr"></div>
  </div>

  <div id="app"></div>

  <div class="result" id="result">
    <div class="score-card">
      <div class="score-num" id="scoreNum">0<small>/30</small></div>
      <div class="score-msg" id="scoreMsg"></div>
      <div class="score-grid" id="scoreGrid"></div>
      <div class="sync" id="sync"></div>
    </div>
  </div>

  <footer>Kiểm tra cuối khóa HSK2 · 共30题</footer>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="prog">
      <div class="prog-top"><span id="pLabel">Đã làm 0/30</span><span id="pPct">0%</span></div>
      <div class="track"><div class="fill" id="pFill"></div></div>
    </div>
    <div class="clock" id="clock">00:00</div>
    <button class="act" id="btnCheck">Nộp bài</button>
    <button class="act ghost" id="btnReset">Làm lại</button>
  </div>
</div>

const TOTAL = 30;
const answers = {};
const KEY = {};
const QTEXT = {};
let graded = false;
let userName = "";
let startedAt = null;
let timerId = null;

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function pad(n){ return (n<10?"0":"") + n; }
function mmss(sec){ return pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
function show(v){ return v === "Y" ? "✓" : v === "N" ? "✗" : (v || "—"); }

function makeQ(q, kind, letters, words){
  KEY[q.no] = q.a;
  QTEXT[q.no] = q.t;
  const box = el("div","q");
  box.dataset.no = q.no;
  const line = el("div","q-text");
  line.appendChild(el("span","q-no", q.no));
  line.appendChild(el("span","", q.t));
  box.appendChild(line);

  const opts = el("div","opts");
  let list;
  if(kind === "tf")      list = [["Y","✓"],["N","✗"]];
  else if(kind === "mc") list = q.o;
  else                   list = letters.map(L => [L, words ? words[L] : ""]);

  list.forEach(([val,label])=>{
    const b = el("button","opt" + (kind==="tf" ? " tf":""));
    b.dataset.val = val;
    if(kind === "tf")      b.textContent = label;
    else                   b.innerHTML = '<span class="k">'+val+'</span>'+(label||"");
    b.onclick = () => {
      if(graded) return;
      answers[q.no] = val;
      [...opts.children].forEach(c => c.classList.remove("sel"));
      b.classList.add("sel");
      updateProgress();
    };
    opts.appendChild(b);
  });
  box.appendChild(opts);
  box.appendChild(el("div","fb"));
  return box;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  DATA.forEach(sec=>{
    const s = el("section");
    const h = el("div","sec-head");
    h.appendChild(el("div","sec-num", sec.n));
    h.appendChild(el("h2","sec-title", "第" + sec.n + "部分　" + sec.title));
    s.appendChild(h);
    s.appendChild(el("p","sec-note", sec.note));

    if(sec.bank){
      const b = el("div","bank" + (sec.bank.inline ? " inline" : ""));
      b.appendChild(el("div","bank-title", sec.bank.title));
      const ul = el("ul");
      sec.bank.items.forEach(([L,w])=>{
        ul.appendChild(el("li","", '<span class="lt">'+L+'</span>'+w));
      });
      b.appendChild(ul);
      s.appendChild(b);
    }

    if(sec.qs){
      const kind = sec.bank && sec.bank.inline ? "fill" : "match";
      sec.qs.forEach(q => s.appendChild(makeQ(q, kind, sec.letters, sec.words)));
    }

    if(sec.passages){
      sec.passages.forEach(p=>{
        const pb = el("div","passage");
        pb.appendChild(el("span","tag", p.tag));
        p.text.forEach(t => pb.appendChild(el("p","", t)));
        s.appendChild(pb);
        p.qs.forEach(q => s.appendChild(makeQ(q, q.o ? "mc" : "tf")));
      });
    }
    app.appendChild(s);
  });
  updateProgress();
}

function updateProgress(){
  const done = Object.keys(answers).length;
  const pct = Math.round(done / TOTAL * 100);
  document.getElementById("pLabel").textContent = "Đã làm " + done + "/" + TOTAL;
  document.getElementById("pPct").textContent = pct + "%";
  document.getElementById("pFill").style.width = pct + "%";
}

function tick(){
  const sec = Math.floor((Date.now() - startedAt) / 1000);
  document.getElementById("clock").textContent = mmss(sec);
}

function start(){
  const inp = document.getElementById("nameInput");
  const name = inp.value.trim();
  if(name.length < 2){
    document.getElementById("nameErr").textContent = "Bạn hãy nhập tên trước khi làm bài nhé.";
    inp.focus();
    return;
  }
  userName = name;
  document.getElementById("nameErr").textContent = "";
  document.getElementById("gate").style.display = "none";
  const who = document.getElementById("who");
  who.textContent = "Người làm: " + userName;
  who.classList.add("on");
  document.getElementById("bar").classList.add("on");
  render();
  startedAt = Date.now();
  document.getElementById("clock").textContent = "00:00";
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}

function check(){
  if(graded) return;
  const done = Object.keys(answers).length;
  if(done < TOTAL && !confirm("Bạn còn " + (TOTAL - done) + " câu chưa làm. Vẫn nộp bài?")) return;

  graded = true;
  clearInterval(timerId);
  const durationSec = Math.floor((Date.now() - startedAt) / 1000);

  let right = 0;
  const wrongNos = [];
  const detail = [];

  document.querySelectorAll(".q").forEach(box=>{
    const no = +box.dataset.no;
    const correct = KEY[no];
    const mine = answers[no] || "";
    box.classList.add("graded");
    box.querySelectorAll(".opt").forEach(b=>{
      const v = b.dataset.val;
      if(v === correct) b.classList.add("good");
      else if(v === mine) b.classList.add("bad");
      b.classList.remove("sel");
    });
    const ok = mine === correct;
    const fb = box.querySelector(".fb");
    if(ok){
      right++;
      fb.className = "fb y";
      fb.textContent = "✓ Đúng";
    }else{
      wrongNos.push(no);
      fb.className = "fb n";
      fb.textContent = mine ? ("✗ Sai — đáp án đúng: " + show(correct))
                            : ("Chưa chọn — đáp án đúng: " + show(correct));
    }
    detail.push({ no:no, picked:show(mine), correct:show(correct), ok:ok });
  });

  const r = document.getElementById("result");
  r.classList.add("on");
  document.getElementById("scoreNum").innerHTML = right + "<small>/" + TOTAL + "</small>";
  const pct = right / TOTAL * 100;
  let msg;
  if(pct === 100)     msg = "满分！真不错 — Tuyệt đối chính xác!";
  else if(pct >= 80)  msg = "很好！Bạn đã nắm vững từ vựng HSK 2.";
  else if(pct >= 60)  msg = "不错！Xem lại những câu sai một lần nữa nhé.";
  else                msg = "再来一次 — Hãy đọc lại các đoạn văn rồi làm lại.";
  document.getElementById("scoreMsg").textContent = msg;

  const grid = document.getElementById("scoreGrid");
  grid.innerHTML = "";
  grid.appendChild(el("div","", "Đúng " + right));
  grid.appendChild(el("div","", "Sai " + (TOTAL - right)));
  grid.appendChild(el("div","", "Thời gian " + mmss(durationSec)));
  grid.appendChild(el("div","", wrongNos.length ? ("Câu sai: " + wrongNos.join(", ")) : "Không có câu sai"));

  sendToSheet({
    name: userName,
    startedAt: new Date(startedAt).toISOString(),
    submittedAt: new Date().toISOString(),
    durationSec: durationSec,
    durationText: mmss(durationSec),
    correct: right,
    total: TOTAL,
    scorePercent: Math.round(pct),
    wrongNos: wrongNos,
    detail: detail
  });

  r.scrollIntoView({behavior:"smooth", block:"center"});
}

function sendToSheet(payload){
  const s = document.getElementById("sync");
  if(!SHEET_URL){
    s.textContent = "";
    return;
  }
  s.textContent = "Đang gửi kết quả…";
  const body = JSON.stringify(payload);
  fetch(SHEET_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: body
  }).then(res => res.text())
    .then(() => { s.textContent = "✓ Đã lưu kết quả vào Google Sheet"; })
    .catch(() => {
      // CORS chặn đọc phản hồi → gửi lại kiểu "fire and forget"
      fetch(SHEET_URL, { method:"POST", mode:"no-cors",
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: body })
        .then(() => { s.textContent = "✓ Đã gửi kết quả"; })
        .catch(() => { s.textContent = "⚠ Không gửi được kết quả (kiểm tra lại link Apps Script)"; });
    });
}

function reset(){
  graded = false;
  for(const k in answers) delete answers[k];
  document.getElementById("result").classList.remove("on");
  document.getElementById("sync").textContent = "";
  render();
  startedAt = Date.now();
  document.getElementById("clock").textContent = "00:00";
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("btnStart").onclick = start;
document.getElementById("nameInput").addEventListener("keydown", e => { if(e.key === "Enter") start(); });
document.getElementById("btnCheck").onclick = check;
document.getElementById("btnReset").onclick = reset;
</script>
</body>
